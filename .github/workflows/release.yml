name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            args: --linux --x64
          - label: Windows
            os: windows-latest
            args: --win --x64
          - label: macOS
            os: macos-latest
            args: --mac --x64 --arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weaver-app/package-lock.json

      - name: Install dependencies
        working-directory: weaver-app
        run: npm ci

      - name: Build app
        working-directory: weaver-app
        env:
          NG_CLI_ANALYTICS: "false"
        run: |
          npm run build:prod
          npm run build:electron

      - name: Package installers
        working-directory: weaver-app
        shell: bash
        env:
          BUILDER_ARGS: ${{ matrix.args }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          read -r -a args <<< "$BUILDER_ARGS"
          args+=(--publish never)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            args+=("-c.extraMetadata.version=${version}")
            echo "Packaging version ${version}"
          fi
          npx electron-builder "${args[@]}"

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installers
          shopt -s nullglob
          files=(weaver-app/release/*.AppImage weaver-app/release/*.deb weaver-app/release/*.exe weaver-app/release/*.dmg)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No installers were produced"
            exit 1
          fi
          cp "${files[@]}" installers/
          ls -lh installers

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: weaver-${{ matrix.label }}
          path: installers/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: weaver-*
          merge-multiple: true
          path: installers

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

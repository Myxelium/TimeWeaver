name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump package version
        id: bump
        working-directory: weaver-app
        run: |
          set -euo pipefail
          npm version "${{ inputs.bump }}" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${version}"

      - name: Commit and tag
        id: tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weaver-app/package.json weaver-app/package-lock.json
          git commit -m "Bump version to ${VERSION}"
          git tag "${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "refs/tags/${VERSION}"
          echo "ref=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            args: --linux --x64
          - label: Windows
            os: windows-latest
            args: --win --x64
          - label: macOS
            os: macos-latest
            args: --mac --x64 --arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weaver-app/package-lock.json

      - name: Install dependencies
        working-directory: weaver-app
        run: npm ci

      - name: Build app
        working-directory: weaver-app
        env:
          NG_CLI_ANALYTICS: "false"
        run: |
          npm run build:prod
          npm run build:electron

      - name: Package installers
        working-directory: weaver-app
        shell: bash
        env:
          BUILDER_ARGS: ${{ matrix.args }}
          RELEASE_REF: ${{ needs.prepare.outputs.ref || github.ref_name }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          read -r -a args <<< "$BUILDER_ARGS"
          args+=(--publish never)
          version="${RELEASE_REF#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            args+=("-c.extraMetadata.version=${version}")
            echo "Packaging version ${version}"
          fi
          npx electron-builder "${args[@]}"

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installers
          shopt -s nullglob
          files=(weaver-app/release/*.AppImage weaver-app/release/*.deb weaver-app/release/*.exe weaver-app/release/*.dmg)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No installers were produced"
            exit 1
          fi
          cp "${files[@]}" installers/
          ls -lh installers

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: weaver-${{ matrix.label }}
          path: installers/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: weaver-*
          merge-multiple: true
          path: installers

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.ref || github.ref_name }}
          files: installers/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.prepare.outputs.ref || github.ref_name, '-') }}

@if (isOverlay) {
    @if (overlayFromRoute) {
        <router-outlet />
    } @else {
        <app-popup-overlay />
    }
} @else {
    <div class="min-h-screen bg-background">
        <app-header />

        <div class="flex h-[calc(100vh-64px)]">
            <app-sidebar />

            <main class="flex-1 overflow-auto p-6">
                <router-outlet />
            </main>
        </div>

        <app-task-details-modal
            (closed)="taskDetails.closeDetails()"
            (saveTask)="taskDetails.saveTask($event)"
            [isOpen]="taskDetails.isOpen()"
            [taskList]="taskDetails.detailedTasks()"
            [title]="taskDetails.title()"
        />
    </div>
}

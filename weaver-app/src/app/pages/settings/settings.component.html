<div class="p-6 space-y-6">
    <h1 class="text-2xl font-semibold">Settings</h1>
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-6 max-w-md">
        <div>
            <label class="form-label" for="monthlyIncome">Monthly Income (What I earn)</label>
            <input id="monthlyIncome" type="number" step="0.01" formControlName="monthlyIncome" class="input-base" />
        </div>
        <div>
            <label class="form-label" for="monthlyCost">Monthly Cost (Business pays)</label>
            <input id="monthlyCost" type="number" step="0.01" formControlName="monthlyCost" class="input-base" />
        </div>
        <div class="flex items-center space-x-2">
            <input id="darkMode" type="checkbox" formControlName="darkMode" class="h-4 w-4" />
            <label for="darkMode" class="text-sm">Dark Mode</label>
        </div>
        <div class="flex items-center space-x-2">
            <input id="ignoreWeekends" type="checkbox" formControlName="ignoreWeekends" class="h-4 w-4" />
            <label for="ignoreWeekends" class="text-sm">Ignore Weekends (exclude from working day stats)</label>
        </div>
        <div>
            <button type="submit" class="btn-primary px-4 py-2">Save</button>
        </div>
    </form>
</div>

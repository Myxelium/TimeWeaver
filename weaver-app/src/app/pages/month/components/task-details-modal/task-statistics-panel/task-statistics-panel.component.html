<div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
    <div class="card-panel flex h-full items-center gap-3 !p-3">
        <div class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-secondary">
            <lucide-icon
                [img]="Clock"
                [size]="18"
                class="text-foreground"
            />
        </div>

        <div class="min-w-0">
            <p class="text-xs text-muted-foreground">Total time</p>
            <p class="text-xl font-bold leading-tight text-foreground">{{ statistics.totalHours | number: '1.0-2' }} h</p>
        </div>
    </div>

    <div class="card-panel flex h-full items-center gap-3 !p-3">
        <div class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-secondary">
            <lucide-icon
                [img]="List"
                [size]="18"
                class="text-foreground"
            />
        </div>

        <div class="min-w-0">
            <p class="text-xs text-muted-foreground">Entries</p>
            <p class="text-xl font-bold leading-tight text-foreground">{{ statistics.totalTasks }}</p>
        </div>
    </div>

    <div class="card-panel flex h-full items-center gap-3 !p-3">
        <div class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-secondary">
            <lucide-icon
                [img]="TrendingUp"
                [size]="18"
                class="text-foreground"
            />
        </div>

        <div class="min-w-0">
            <p class="text-xs text-muted-foreground">Avg. hours / active day</p>
            <p class="text-xl font-bold leading-tight text-foreground">{{ statistics.averageHoursPerDay | number: '1.0-2' }} h</p>
        </div>
    </div>

    <div class="card-panel flex h-full items-center gap-3 !p-3">
        <div class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-secondary">
            <lucide-icon
                [img]="Calendar"
                [size]="18"
                class="text-foreground"
            />
        </div>

        <div class="min-w-0">
            <p class="text-xs text-muted-foreground">Active days</p>
            <p class="text-xl font-bold leading-tight text-foreground">{{ statistics.uniqueDays }}</p>
        </div>
    </div>
</div>

@if (isOpen) {
    <div class="fixed inset-0 z-[80] flex items-center justify-center p-4">
        <div
            (click)="onClose()"
            (keydown.escape)="onClose()"
            role="button"
            tabindex="0"
            class="fixed inset-0 bg-black/50"
        >
        </div>

        <div class="relative bg-background border border-border rounded-lg shadow-lg max-w-4xl w-full max-h-[90vh] overflow-y-auto flex flex-col">
            <div class="sticky top-0 z-10 bg-background flex items-center justify-between gap-3 p-6 border-b border-border flex-shrink-0">
                <div class="flex items-center gap-2 min-w-0">
                    @if (showBack) {
                        <button
                            (click)="onBack()"
                            type="button"
                            class="btn-icon flex-shrink-0"
                            aria-label="Back to edit day"
                            title="Back"
                        >
                            <lucide-icon [img]="ChevronLeft" class="w-4 h-4" />
                        </button>
                    }

                    <h2 class="section-heading mb-0">Task Details - {{ title || 'Tasks' }}</h2>
                </div>

                <button
                    (click)="onClose()"
                    type="button"
                    class="text-muted-foreground hover:text-foreground transition-colors"
                    aria-label="Close"
                >
                    <svg
                        class="w-6 h-6"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"
                        />
                    </svg>
                </button>
            </div>

            <div class="p-6">
                <app-task-statistics-panel [statistics]="statistics" />

                <app-task-entry-list
                    (enableEdit)="enableEdit($event)"
                    (saveTask)="saveTaskEdit($event)"
                    (cancelEdit)="cancelTaskEdit($event)"
                    [tasks]="localTasks"
                />
            </div>

            <div class="sticky bottom-0 z-10 bg-background flex justify-end space-x-3 p-6 border-t border-border flex-shrink-0">
                <button
                    (click)="onClose()"
                    type="button"
                    class="btn-outline px-4 py-2"
                >
                    Close
                </button>
            </div>
        </div>
    </div>
}

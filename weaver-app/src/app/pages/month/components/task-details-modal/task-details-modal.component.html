@if (isOpen) {
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div
            (click)="onClose()"
            (keydown.escape)="onClose()"
            role="button"
            tabindex="0"
            class="fixed inset-0 bg-black/50"
        ></div>

        <div class="relative bg-background border border-border rounded-lg shadow-lg max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col">
            <div class="flex items-center justify-between p-6 border-b border-border flex-shrink-0">
                <h2 class="section-heading mb-0">Task Details - {{ title || 'Tasks' }}</h2>

                <button
                    type="button"
                    (click)="onClose()"
                    class="text-muted-foreground hover:text-foreground transition-colors"
                    aria-label="Close"
                >
                    <svg
                        class="w-6 h-6"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"
                        />
                    </svg>
                </button>
            </div>

            <div class="p-6 overflow-y-auto flex-1">
                <div class="space-y-3">
                    <div class="grid grid-cols-12 gap-2 text-xs font-medium text-muted-foreground">
                        <div class="col-span-3">Date</div>
                        <div class="col-span-5">Title & Description</div>
                        <div class="col-span-2 text-right">Hours</div>
                        <div class="col-span-2">Actions</div>
                    </div>

                    <div class="divide-y">
                        @for (task of localTasks; let index = $index; track task.id ?? index) {
                            <div class="grid grid-cols-12 gap-2 py-2 items-start">
                                <div class="col-span-3">
                                    <input
                                        [(ngModel)]="task.date"
                                        [disabled]="!task.editing"
                                        type="date"
                                        class="input-base w-full text-xs"
                                    />
                                </div>

                                <div class="col-span-5 space-y-1">
                                    <input
                                        [(ngModel)]="task.title"
                                        [disabled]="!task.editing"
                                        class="input-base w-full text-xs"
                                    />

                                    <textarea
                                        [(ngModel)]="task.description"
                                        [disabled]="!task.editing"
                                        class="textarea-base w-full text-xs min-h-[40px]"
                                    >
                                    </textarea>
                                </div>

                                <div class="col-span-2">
                                    <input
                                        [(ngModel)]="task.hours"
                                        [disabled]="!task.editing"
                                        type="number"
                                        step="0.25"
                                        class="input-base w-full text-xs text-right"
                                    />
                                </div>

                                <div class="col-span-2 flex items-center space-x-2">
                                    @if (!task.editing) {
                                        <button
                                            type="button"
                                            (click)="enableEdit(index)"
                                            class="btn-secondary px-2 py-1 text-xs"
                                        >
                                            Edit
                                        </button>
                                    } @else {
                                        <button
                                            type="button"
                                            (click)="save(index)"
                                            class="btn-primary px-2 py-1 text-xs"
                                        >
                                            Save
                                        </button>

                                        <button
                                            type="button"
                                            (click)="cancel(index)"
                                            class="btn-outline px-2 py-1 text-xs"
                                        >
                                            Cancel
                                        </button>
                                    }
                                </div>
                            </div>
                        }
                    </div>
                </div>
            </div>

            <div class="flex justify-end space-x-3 p-6 border-t border-border flex-shrink-0">
                <button
                    type="button"
                    (click)="onClose()"
                    class="btn-outline px-4 py-2"
                >
                    Close
                </button>
            </div>
        </div>
    </div>
}

<div class="space-y-3">
    <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-muted-foreground uppercase tracking-wide">Task Entries</h3>
    </div>

    <div class="grid grid-cols-12 gap-2 text-xs font-medium text-muted-foreground">
        <div class="col-span-3">Date</div>
        <div class="col-span-5">Title & Description</div>
        <div class="col-span-2 text-right">Hours</div>
        <div class="col-span-2">Actions</div>
    </div>

    <div>
        @for (task of tasks; let index = $index; track task.id ?? index) {
            @if (isNewMonth(index)) {
                <div [class.pt-0]="index === 0" class="flex items-center gap-3 py-3">
                    <div class="flex-1 h-px bg-border"></div>

                    <span class="text-xs font-medium text-muted-foreground/70 uppercase tracking-wider">
                        {{ formatMonthLabel(task.date) }}
                    </span>

                    <div class="flex-1 h-px bg-border"></div>
                </div>
            }

            <div class="grid grid-cols-12 gap-2 py-2 items-start border-b border-border/50 last:border-b-0">
                <div class="col-span-3">
                    <input
                        [(ngModel)]="task.date"
                        [disabled]="!task.editing"
                        type="date"
                        class="input-base w-full text-xs"
                    />
                </div>

                <div class="col-span-5 space-y-1">
                    <input
                        [(ngModel)]="task.title"
                        [disabled]="!task.editing"
                        class="input-base w-full text-xs"
                    />

                    <textarea
                        [(ngModel)]="task.description"
                        [disabled]="!task.editing"
                        class="textarea-base w-full text-xs min-h-[40px]"
                    >
                    </textarea>
                </div>

                <div class="col-span-2">
                    <input
                        [(ngModel)]="task.hours"
                        [disabled]="!task.editing"
                        type="number"
                        step="0.25"
                        class="input-base w-full text-xs text-right"
                    />
                </div>

                <div class="col-span-2 flex items-center space-x-2">
                    @if (!task.editing) {
                        <button
                            (click)="enableEdit.emit(index)"
                            type="button"
                            class="btn-secondary px-2 py-1 text-xs"
                        >
                            Edit
                        </button>
                    } @else {
                        <button
                            (click)="saveTask.emit(index)"
                            type="button"
                            class="btn-primary px-2 py-1 text-xs"
                        >
                            Save
                        </button>

                        <button
                            (click)="cancelEdit.emit(index)"
                            type="button"
                            class="btn-outline px-2 py-1 text-xs"
                        >
                            Cancel
                        </button>
                    }
                </div>
            </div>
        }
    </div>
</div>

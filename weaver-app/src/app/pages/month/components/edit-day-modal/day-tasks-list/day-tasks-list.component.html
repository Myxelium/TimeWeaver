@if (show) {
    <div>
        <h3 class="panel-heading">Tasks</h3>

        @if (tasks.length > 0) {
            <div class="space-y-3 max-h-96 overflow-y-auto">
                @for (task of tasks; track task.id) {
                    <div class="task-row">
                        <div class="flex-1 min-w-0">
                            <div class="font-medium">
                                <app-ado-title [adoWorkItemId]="task.adoWorkItemId ?? null" [title]="task.title" />
                            </div>

                            @if (task.description) {
                                <div class="text-sm text-muted-foreground truncate">{{ task.description }}</div>
                            }
                        </div>

                        <div class="task-actions flex-shrink-0">
                            <span class="hours-badge">{{ task.hours | number: '1.1-1' }}h</span>

                            <button
                                (click)="edit.emit(task)"
                                type="button"
                                class="icon-btn"
                                title="Edit task"
                            >
                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                                    />
                                </svg>
                            </button>

                            <button
                                (click)="delete.emit(task.id!)"
                                type="button"
                                class="icon-btn-danger"
                                title="Delete task"
                            >
                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                                    />
                                </svg>
                            </button>
                        </div>
                    </div>
                }
            </div>
        } @else {
            <div class="text-center py-8 text-muted-foreground border border-dashed border-border rounded-lg">No tasks recorded for this day</div>
        }
    </div>
}

<aside class="w-64 bg-card border-r border-border">
  <nav class="p-4 space-y-2">
    @for (item of navItems; track item.path) {
      <a 
        [routerLink]="item.path"
        routerLinkActive="bg-accent text-accent-foreground"
        class="flex items-center space-x-3 px-3 py-2 rounded-md text-sm font-medium text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-colors">
        <lucide-icon [name]="item.icon" class="w-5 h-5"></lucide-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>

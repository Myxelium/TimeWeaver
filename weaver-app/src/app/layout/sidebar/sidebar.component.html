<aside class="w-16 bg-card border-border flex flex-col h-full">
    <nav class="flex-1">
        <div class="flex py-6 flex-col space-y-1 border-r">
            @for (item of navItems; track item.path) {
                <a
                    #rla="routerLinkActive"
                    [routerLink]="item.path"
                    [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                    [title]="item.title"
                    class="relative flex items-center justify-center w-12 h-12 mx-2 rounded-lg hover:bg-accent hover:text-accent-foreground transition-colors group"
                    routerLinkActive="bg-primary text-primary-foreground"
                >
                    <div class="w-6 h-6 flex items-center justify-center">
                        @switch (item.icon) {
                            @case ('home') {
                                <svg
                                    class="w-5 h-5"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        d="M3 12l2-2m0 0l7-7 7 7
        M5 10v10a1 1 0 001 1h3
        m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3
        m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4
        a1 1 0 001 1m-6 0h6"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                    />
                                </svg>
                            }
                            @case ('calendar') {
                                <svg
                                    class="w-5 h-5"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                    />
                                </svg>
                            }
                            @case ('archive') {
                                <svg
                                    class="w-5 h-5"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                    />
                                </svg>
                            }
                        }
                    </div>

                    <div
                        class="absolute left-full ml-2 px-2 py-1 bg-popover text-popover-foreground text-sm rounded shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap z-50"
                    >
                        {{ item.label }}
                    </div>
                </a>
            }
        </div>
    </nav>

    <nav>
        <div class="flex py-6 flex-col space-y-1 border-r">
            <a
                [routerLinkActiveOptions]="{ exact: true }"
                class="relative flex items-center justify-center w-12 h-12 mx-2 rounded-lg hover:bg-accent hover:text-accent-foreground transition-colors group"
                routerLink="/settings"
                routerLinkActive="bg-primary text-primary-foreground"
                title="Settings"
            >
                <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.266.07 2.572-1.065z"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                    />

                    <path
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                    />
                </svg>
            </a>
        </div>
    </nav>
</aside>
